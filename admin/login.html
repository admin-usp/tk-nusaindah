<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator — SIM Sekolah TK</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
        }
        
        .login-box {
            width: 400px;
            max-width: 92%;
        }
        
        .card {
            border-radius: 18px;
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="hold-transition login-page">
    <div class="login-box">
        <div class="card card-outline card-primary">
            <div class="card-header text-center py-4">
                <a href="../index.html" class="h3 font-weight-bold text-dark">
                    <i class="fa-solid fa-shapes text-warning mr-2"></i><b>SIM</b> TK Ceria
                </a>
                <p class="text-muted small mb-0 mt-1">Portal Administrasi & Manajemen Sekolah</p>
            </div>
            <div class="card-body">
                <form id="adminLoginForm">
                    <div class="input-group mb-3">
                        <input type="email" id="loginEmail" class="form-control" placeholder="Email Administrator" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-4">
                        <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <button type="submit" id="btnLogin" class="btn btn-primary btn-block font-weight-bold py-2">
                        <i class="fas fa-sign-in-alt mr-2"></i> Masuk ke Dashboard
                    </button>
                </form>
                <div class="text-center mt-4">
                    <a href="../index.html" class="small text-muted"><i class="fas fa-arrow-left mr-1"></i> Kembali ke Website Utama</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/supabase.js"></script>

    <script>
        // Fallback inisialisasi jika halaman dijalankan terisolasi tanpa relative script ../assets/js/supabase.js
        if (typeof window.supabaseClient === 'undefined' && window.supabase) {
            const sbUrl = window.ENV ? .SUPABASE_URL || 'https://YOUR_PROJECT_ID.supabase.co';
            const sbKey = window.ENV ? .SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
            window.supabaseClient = window.supabase.createClient(sbUrl, sbKey);
        }

        if (typeof window.logAdminActivity !== 'function') {
            window.logAdminActivity = async function() {
                return;
            };
        }

        document.addEventListener('DOMContentLoaded', async() => {
            try {
                const urlStr = window.supabaseClient ? .supabaseUrl || '';
                if (!urlStr || urlStr.includes('YOUR_PROJECT_ID')) return;

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                console.warn('Sesi belum aktif:', e.message);
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm mr-2"></span>Memverifikasi...';

            try {
                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                if (error) throw error;

                // Cek profil & role di tabel profiles
                const {
                    data: profile,
                    error: profErr
                } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (profErr || !profile || !profile.is_active) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Akun Anda tidak memiliki izin akses administrator atau dinonaktifkan.');
                }

                await logAdminActivity('LOGIN', 'profiles', data.user.id, `Login berhasil oleh ${profile.full_name}`);
                window.location.href = 'dashboard.html';
            } catch (err) {
                Swal.fire('Login Gagal', err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Masuk ke Dashboard';
            }
        });
    </script>
</body>

</html>
